<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sparkh Infotech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f4ef;
      --ink: #1c1917;
      --muted: #6b6b6b;
      --border: #d0cdc9;
      --card: #ffffff;
      --serif: 'DM Serif Display', Georgia, serif;
      --sans: 'DM Sans', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      min-width: 1100px;
      overflow: hidden;
      height: 100vh;
    }

 
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 48px;
      height: 68px;
      background: rgba(247, 244, 239, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: var(--serif);
      font-size: 1.35rem;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-dot {
      width: 7px; height: 7px;
      background: var(--ink);
      border-radius: 50%;
      flex-shrink: 0;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2px;
      list-style: none;
    }
    .nav-links a {
      font-family: var(--sans);
      font-size: 0.875rem;
      font-weight: 400;
      color: var(--muted);
      text-decoration: none;
      padding: 7px 14px;
      border-radius: 6px;
      transition: color 0.18s, background 0.18s;
      letter-spacing: 0.01em;
    }
    .nav-links a:hover {
      color: var(--ink);
      background: rgba(28,25,23,0.06);
    }
    .nav-cta {
      font-weight: 500 !important;
      color: var(--card) !important;
      background: var(--ink) !important;
      padding: 7px 18px !important;
    }
    .nav-cta:hover { background: var(--muted) !important; }


    .hero {
      max-width: 1100px;
      margin: 0 auto;
      padding: 96px 48px 80px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
      align-items: center;
    }

    .hero-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
    }
    .hero-label::before {
      content: '';
      display: block;
      width: 28px; height: 1px;
      background: var(--muted);
    }

    .hero h1 {
      font-family: var(--serif);
      font-size: 3.8rem;
      line-height: 1.08;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin-bottom: 24px;
    }
    .hero h1 em {
      font-style: italic;
      color: var(--muted);
    }

    .hero p {
      font-size: 1rem;
      color: var(--muted);
      line-height: 1.75;
      max-width: 420px;
      margin-bottom: 36px;
    }

    .hero-actions {
      display: flex;
      gap: 14px;
    }
    .btn {
      display: inline-block;
      padding: 12px 26px;
      border-radius: 6px;
      font-family: var(--sans);
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
    }
    .btn-primary { background: var(--ink); color: #fff; }
    .btn-primary:hover { background: var(--muted); }
    .btn-outline { border: 1px solid var(--border); color: var(--ink); background: transparent; }
    .btn-outline:hover { border-color: var(--ink); }

    .hero-visual {
      background: var(--ink);
      border-radius: 12px;
      padding: 28px 32px;
      font-family: 'Courier New', monospace;
      font-size: 0.82rem;
      line-height: 1.85;
      color: #a8a29e;
      overflow: hidden;
      position: relative;
    }
    .hero-visual::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: #444;
    }
    .hero-visual .bar {
      display: flex;
      gap: 7px;
      margin-bottom: 20px;
    }
    .hero-visual .bar span {
      width: 11px; height: 11px;
      border-radius: 50%;
      background: #3a3a3a;
    }
    .c-key  { color: #ccc; }
    .c-str  { color: #aaa; }
    .c-fn   { color: #e5e5e5; }
    .c-comm { color: #555; }
    .c-num  { color: #bbb; }
    .c-val  { color: #e5e7eb; }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="#" class="logo"><span class="logo-dot"></span>Sparkh Infotech</a>
    <ul class="nav-links">
      <li><a href="#">Services</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
      <li><a href="#" class="nav-cta">Let's talk</a></li>
    </ul>
  </nav>

  <section class="hero">
    <div>
      <p class="hero-label">Web Development</p>
       <h1>Sparkh Infotech <br>builds <i>innovation.</i></h1>
      <p>
      At Sparkh Infotech, we build fast, responsive, and user-friendly websites that strengthen your online presence.
      </p>
      <div class="hero-actions">
        <a href="#" class="btn btn-primary">See our services</a>
        <a href="#" class="btn btn-outline">View case studies</a>
      </div>
    </div>
    
    </div>
  </section>

</body>
</html>
