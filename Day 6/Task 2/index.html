<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sparkh Infotech</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0e0e;
  --surface:#161616;
  --border:#2a2a2a;
  --text:#e8e4dc;
  --muted:#706b62;
  --accent:#e8773a;
  --serif:'Playfair Display',Georgia,serif;
  --sans:'Manrope',sans-serif;
}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);overflow-x:hidden}


nav{
  position:sticky;top:0;z-index:99;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 56px;height:66px;
  background:rgba(14,14,14,0.88);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.logo{font-family:var(--serif);font-size:1.3rem;color:var(--text);text-decoration:none;letter-spacing:-0.3px}
.logo span{color:var(--accent)}
.menu-toggle{display:none}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:8px;border-radius:6px}
.hamburger:hover{background:rgba(255,255,255,0.05)}
.hamburger span{display:block;width:22px;height:1.5px;background:var(--text);border-radius:2px;transition:all .25s}
.nav-links{display:flex;align-items:center;gap:2px;list-style:none}
.nav-links a{font-size:.83rem;font-weight:400;color:var(--muted);text-decoration:none;padding:6px 14px;border-radius:6px;letter-spacing:.02em;transition:color .15s,background .15s}
.nav-links a:hover{color:var(--text);background:rgba(255,255,255,0.05)}
.nav-cta{font-weight:600!important;color:#0e0e0e!important;background:var(--accent)!important;padding:7px 20px!important}
.nav-cta:hover{background:#f0894e!important}

@media(max-width:768px){
  nav{padding:0 24px}
  .hamburger{display:flex}
  .nav-links{
    display:none;position:absolute;top:66px;left:0;right:0;
    flex-direction:column;align-items:stretch;
    background:#161616;border-bottom:1px solid var(--border);
    padding:12px 20px 20px;gap:2px
  }
  .nav-links a{display:block;padding:12px 14px;font-size:.95rem}
  .menu-toggle:checked ~ .nav-links{display:flex}
  .menu-toggle:checked ~ .hamburger span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
  .menu-toggle:checked ~ .hamburger span:nth-child(2){opacity:0;transform:scaleX(0)}
  .menu-toggle:checked ~ .hamburger span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}
}


.hero{
  height:calc(100vh - 66px);
  display:flex;align-items:center;
  padding:0 56px;
  position:relative;
  overflow:hidden;
}
.hero::before{
  content:'';position:absolute;
  top:-180px;right:-180px;
  width:640px;height:640px;
  background:radial-gradient(circle,rgba(232,119,58,.13) 0%,transparent 68%);
  pointer-events:none;
}
.hero::after{
  content:'';position:absolute;
  bottom:-120px;left:-120px;
  width:420px;height:420px;
  background:radial-gradient(circle,rgba(232,119,58,.06) 0%,transparent 70%);
  pointer-events:none;
}
.hero-inner{max-width:720px;position:relative;z-index:1}
.hero-tag{
  display:inline-flex;align-items:center;gap:10px;
  font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin-bottom:28px;
}
.hero-tag::after{content:'';display:block;width:40px;height:1px;background:var(--accent)}
.hero h1{
  font-family:var(--serif);
  font-size:clamp(3rem,6.5vw,5.2rem);
  line-height:1.05;letter-spacing:-.03em;
  color:var(--text);margin-bottom:26px;
}
.hero h1 i{font-style:italic;color:var(--accent)}
.hero p{
  font-size:1.05 rem;font-weight:300;color:var(--muted);
  line-height:1.82;max-width:540px;margin-bottom:42px;
}
.hero-btns{display:flex;gap:14px;flex-wrap:wrap}
.btn{
  display:inline-block;padding:13px 28px;border-radius:7px;
  font-family:var(--sans);font-size:.875rem;font-weight:600;
  text-decoration:none;letter-spacing:.01em;transition:all .2s;
}
.btn-fill{background:var(--accent);color:#0e0e0e}
.btn-fill:hover{background:#f0894e}
.btn-ghost{border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--muted)}

@media(max-width:768px){
  .hero{padding:0 24px;height:auto;min-height:calc(100vh - 66px)}
}
</style>
</head>
<body>

<nav>
  <input type="checkbox" id="menu-toggle" class="menu-toggle">
  <a href="#" class="logo">Sparkh Infotech<span>.</span></a>
  <label for="menu-toggle" class="hamburger" aria-label="Toggle menu">
    <span></span><span></span><span></span>
  </label>
  <ul class="nav-links">
    <li><a href="#">Services</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Contact</a></li>
    <li><a href="#" class="nav-cta">Let's talk</a></li>
  </ul>
</nav>

<section class="hero">
  <div>
    <p class="hero-label">Web Development</p>
    <h1>Sparkh Infotech <br>builds <i>innovation.</i></h1>
    <p>
     At Sparkh Infotech, we build fast, responsive, and user-friendly websites that strengthen your online presence.

    </p>
    <div class="hero-actions">
      <a href="#" class="btn btn-fill">See our services</a>
      <a href="#" class="btn btn-ghost">View case studies</a>
    </div>
  </div>
</section>

</body>
</html>
